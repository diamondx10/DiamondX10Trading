# DiamondX10 Trading — COPY thành config.yaml và điền thông tin thật của bạn.
# KHÔNG commit config.yaml (đã có trong .gitignore). Không để API key trong repo.
fund:
  name: DiamondX10
  total_capital_usd: 2000
  desks:
    forex: {manager: "Yuling Pan", capital_usd: 500}
    us_securities: {manager: "Kathy", capital_usd: 500}
    xauusd: {manager: "Yumi", capital_usd: 500}
    crypto: {manager: "Rich", capital_usd: 500}
risk:
  max_risk_per_trade_pct: 1.0
  max_drawdown_pct: 10.0
  default_stop_loss_pct: 2.0
data:
  # provider: simulated | mt5
  #   simulated: du lieu mo phong (mac dinh, khong can MT5).
  #   mt5: du lieu thoi gian thuc tu MT5 terminal (Exness DEMO).
  #   Xem docs/mt5-demo.md truoc khi doi sang mt5.
  provider: simulated
  # api_key: "ĐIỀN VÀO config.yaml, KHÔNG commit"
  # api_key_env: DIAMONDX10_API_KEY
  symbols:
    forex: ["EURUSD", "USDJPY", "GBPUSD"]
    us_securities: ["NVDA", "AMD", "CDNS"]
    xauusd: ["XAUUSD"]
    crypto: ["BTCUSD", "ETHUSD"]
mt5:
  # CHI TAI KHOAN DEMO. Connector nay tu choi tai khoan that (xem execution.py).
  demo_only: true
  # Dien vao config.yaml LOCAL (khong commit): so tai khoan demo Exness.
  login: 0
  # Dien ten server demo that, vd "Exness-MT5Trial7" — xem trong MT5 terminal.
  server: ""
  # Mat khau demo: KHONG ghi vao file nay. Dat bien moi truong MT5_PASSWORD
  # (khuyen dung) hoac them dong password: ... vao config.yaml local.
  password_env: MT5_PASSWORD
  # Khung nen lay tu MT5: M1, M5, M15, H1, D1 (mac dinh M15).
  timeframe: M15
