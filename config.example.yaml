# DiamondX10 Trading — COPY thành config.yaml và điền thông tin thật của bạn.
# KHÔNG commit config.yaml (đã có trong .gitignore). Không để API key trong repo.
# Ngon ngu giao dien (vi | en; mac dinh vi): ap dung cho web UI,
# canh bao Telegram va briefing PTCB. CLI / console / log van tieng
# Viet khong dau.
language: vi
fund:
  name: DiamondX10
  total_capital_usd: 10000
  desks:
    forex: {manager: "Yuling Pan", capital_usd: 2500}
    us_securities: {manager: "Kathy", capital_usd: 2500}
    xauusd: {manager: "Yumi", capital_usd: 2500}
    crypto: {manager: "Rich", capital_usd: 2500}
risk:
  max_risk_per_trade_pct: 1.0
  # Rui ro RIENG theo symbol (% von cua symbol do). Chi nhung symbol can
  # rui ro cao hon muc chung 1% moi dat duoc 0.01 lot o stop 5%.
  # Tinh theo gia tham chieu (gia that chay thi tinh lai). Cap nhat
  # 2026-11-27 theo gia TradingView: EURUSD 1.0974, XAUUSD 3.650,98,
  # BTCUSD 61.594. Lot o stop 5% (tinh bang code that): EURUSD 0.01,
  # XAUUSD 0.01, BTCUSD 0.02, ETHUSD 0.09, BNBUSD 0.29, AMD 0.24,
  # INTC 1.83, NVDA 0.66, CDNS 0.33, SNPS 0.24. Symbol khong co trong
  # bang dung muc chung 1%.
  # Neu gia chay vuot gia tham chieu thi symbol do co the lai ve volume 0
  # (tool bao volume 0 chu khong tu tang rui ro) — luc do nhom quyet lai so.
  per_symbol_pct:
    EURUSD: 3.0
    XAUUSD: 10.0
    BTCUSD: 8.0
  max_drawdown_pct: 10.0
  # Canh bao drawdown tung desk (Phase 4, Q1): cham 5% von desk (125 USD)
  # thi chi chan lenh moi cua desk do; gioi han quy 10% (1.000 USD) thi
  # chan lenh moi toan bo. Lenh dang mo chi duoc quan ly, khong dong ep.
  desk_warning_pct: 5.0
  # Gioi han rui ro TOAN QUY (Phase F — xem docs/fund-risk-ops.md).
  # [CẦN CHỐT] Cac con so duoi day CHUA DUOC Phu duyet — gia tri mac
  # dinh than trong de xuat, cho Phu duyet moi thanh quy tac chinh thuc.
  # fund_daily_loss_pct: lo thuc hien trong ngay >= 3% von quy
  #   (300 USD tren von 10.000 USD) thi chan mo lenh moi toan quy den
  #   het ngay; hom sau tinh lai tu dau.
  # max_open_positions_fund: toi da 10 vi the mo cung luc toan quy
  #   (10 symbol trong danh muc -> toi da 1 vi the/symbol).
  # max_open_positions_desk: toi da 2 vi the mo cung luc moi desk.
  fund_daily_loss_pct: 3.0
  max_open_positions_fund: 10
  max_open_positions_desk: 2
  default_stop_loss_pct: 5.0
  default_take_profit_pct: 5.0
# Chien luoc chung Phase 2 (docs/phase0-desk-rules.md, Phu duyet 2026-11-27):
# vao lenh SMA5/SMA20 + loc RSI(14) (BUY khi 50 < RSI < 70,
# SELL khi 30 < RSI < 50; RSI > 80 hoac < 20 thi khong mo lenh moi),
# SL theo ATR, TP = 2 x khoang cach SL (ti le 2:1). Crypto ghi de rieng
# he so ATR vi bien dong manh hon. Bang risk o tren GIU NGUYEN.
strategy:
  sma_fast: 5
  sma_slow: 20
  rsi_period: 14
  rsi_buy_low: 50
  rsi_buy_high: 70
  rsi_sell_low: 30
  rsi_sell_high: 50
  rsi_extreme_high: 80
  rsi_extreme_low: 20
  atr_period: 14
  atr_sl_mult: 1.5
  tp_mult: 2.0
  trail_mult: 1.5
  # Gate ADX(14) / loc ATR% (xem strategies/soft_rules.py): adx_min = 0
  # nghia la TAT (hanh vi cu); min_atr_pct = 0.0 nghia la TAT. Gia tri
  # > 0 thi ADX(14) < adx_min hoac ATR(14)/gia < min_atr_pct -> HOLD,
  # khong mo lenh moi. Ca hai deu co gia tri rieng theo symbol o duoi.
  adx_min: 0
  min_atr_pct: 0.0
  desks:
    crypto: {atr_sl_mult: 2.0, trail_mult: 2.0}
  # Tinh chinh theo symbol (Phase B + bang nghien cuu 2026-11-27).
  # Thu tu uu tien: mac dinh < chung < desk < symbol. Chi nhung truong
  # khac mac dinh chung moi liet ke; con lai thua huong mac dinh.
  # HONEST LIMIT: day la diem xuat phat theo tai lieu / thuc hanh, KHONG
  # phai bang chung sinh loi; nguong min_atr_pct va gate ADX lay tu
  # khoang dien hinh da cong bo, chua kiem chung tren chinh symbol cua
  # dx10. Kiem chung that can backfill MT5 tren Windows + walk-forward
  # compare/sweep xep hang OOS, ~50-100 lenh/symbol. Neu walk-forward
  # cho thay mac dinh chung thang ghi de rieng symbol thi GIU MAC DINH.
  # Nguon: xem docs/strategy-engine.md (MQL5 London Breakout Pro,
  # Pro-Scalper XAUUSD, Camovia gold, Capital.com ADX, ForexBite ATR,
  # Arconomy BTCUSD M15, TradingView EMA 9/21 + RSI + ADX,
  # AlertaChart BTC timing, TradePiko earnings, American Dream ORB).
  per_symbol:
    # Slower cross (8/21) + ADX>=20 cuts M15 whipsaw on the lowest-vol pair; all else = global default.
    EURUSD: {sma_fast: 8, sma_slow: 21, adx_min: 20, min_atr_pct: 0.0001}
    # Slowest trend + widest stops/RSI window for 2-3x FX volatility; 85/15 veto stops fading a gold trend.
    XAUUSD: {sma_fast: 10, sma_slow: 30, rsi_buy_low: 55, rsi_buy_high: 75, rsi_sell_low: 25, rsi_sell_high: 45, rsi_extreme_high: 85, rsi_extreme_low: 15, atr_sl_mult: 2.0, tp_mult: 1.5, trail_mult: 2.0, adx_min: 30, min_atr_pct: 0.0003}
    # Fast 9/21 momentum + ADX>=25 is the published M15 crypto pattern; 2.0xATR survives 24/7 spikes.
    BTCUSD: {sma_fast: 9, sma_slow: 21, rsi_buy_low: 55, rsi_buy_high: 75, rsi_sell_low: 25, rsi_sell_high: 45, rsi_extreme_high: 85, rsi_extreme_low: 15, atr_sl_mult: 2.0, trail_mult: 2.0, adx_min: 25, min_atr_pct: 0.0010}
    # Same momentum frame as BTC but higher hourly volatility, so shorter TP (1.5x).
    ETHUSD: {sma_fast: 9, sma_slow: 21, rsi_buy_low: 55, rsi_buy_high: 75, rsi_sell_low: 25, rsi_sell_high: 45, rsi_extreme_high: 85, rsi_extreme_low: 15, atr_sl_mult: 2.0, tp_mult: 1.5, trail_mult: 2.0, adx_min: 25, min_atr_pct: 0.0015}
    # Near-BTC volatility but no weekend drop-off and less trend persistence; slower cross (10/30), standard stops.
    BNBUSD: {sma_fast: 10, sma_slow: 30, adx_min: 20, min_atr_pct: 0.0010}
    # High-beta semi momentum: wider RSI window lets winners run; 1.5xATR keeps stops inside the session.
    AMD: {sma_fast: 8, sma_slow: 21, rsi_buy_low: 55, rsi_buy_high: 75, rsi_sell_low: 25, rsi_sell_high: 45, rsi_extreme_high: 85, rsi_extreme_low: 15, adx_min: 20, min_atr_pct: 0.0020}
    # Highest-beta name: widest stop/trail + strongest ADX gate; earnings blackout is mandatory.
    NVDA: {sma_fast: 9, sma_slow: 21, rsi_buy_low: 55, rsi_buy_high: 75, rsi_sell_low: 25, rsi_sell_high: 45, rsi_extreme_high: 85, rsi_extreme_low: 15, atr_sl_mult: 2.0, trail_mult: 2.0, adx_min: 25, min_atr_pct: 0.0020}
    # Mean-reversion-prone / weak-trend name: slowest cross, narrowest RSI window, shortest TP, widest trail.
    INTC: {sma_fast: 10, sma_slow: 30, rsi_buy_high: 65, rsi_sell_low: 35, atr_sl_mult: 2.0, tp_mult: 1.5, trail_mult: 2.0, adx_min: 20, min_atr_pct: 0.0015}
    # CDNS, SNPS: no override — keep global default.
  # Quy tac mem (soft rules — xem strategies/soft_rules.py). Bo comment
  # de dung. Moi rule: name (duy nhat, bat buoc), scope (bo qua = moi
  # symbol; {desk: ...} hoac {symbol: ...}), condition (type + tham so),
  # effect: block (dieu kien dung -> HOLD) / require (dieu kien sai ->
  # HOLD) / {type: scale, factor: 0<x<=1} (dieu kien dung -> giam size).
  # Condition v1: rsi_range {low, high}, sma_cross {direction:
  # bullish|bearish}, adx_min {value}, adx_max {value}, atr_pct_min
  # {value}, atr_pct_max {value}, pattern {name}. KHONG co dieu kien
  # cua so thoi gian / phien o v1 (bar time mo phong khong phai epoch);
  # blackout earnings / phien dung co che cung no_trade_events.
  # Rule go sai bao loi LOUD khi load config, khong lang le bo qua.
  # soft_rules:
  #   # XAUUSD: bien dong dot bien — ATR% vuot 0.5% thi khong mo lenh moi.
  #   - {name: xauusd-vol-spike-block, scope: {symbol: XAUUSD},
  #      condition: {type: atr_pct_min, value: 0.005}, effect: block}
  #   # Crypto: xu huong yeu (ADX <= 25) thi giam mot nua size.
  #   - {name: crypto-adx-weak-scale, scope: {desk: crypto},
  #      condition: {type: adx_max, value: 25},
  #      effect: {type: scale, factor: 0.5}}
  #   # EURUSD: khong co xu huong (ADX <= 20) thi khong vao lenh trend.
  #   - {name: eurusd-weak-trend-block, scope: {symbol: EURUSD},
  #      condition: {type: adx_max, value: 20}, effect: block}
# Vong hoc TA (TA learning loop — xem docs/ta-learning-loop.md).
# Ghi lai moi khuyen nghi (outcomes.py), cham diem tu gia that
# (evaluate-signals), xem bai hoc + de xuat tinh chinh (ta-review).
# Vong hoc KHONG tu doi tham so — de xuat chi ap khi Phu duyet tay
# (ta-review --apply, co xac nhan go chu).
learning:
  # So nen M15 cham diem sau khi vao lenh (20 nen = 5 gio): trong
  # cua so nay, TP cham truoc -> thang, SL cham truoc -> thua,
  # khong cham cai nao -> timeout, tinh theo gia cuoi cua so.
  outcome_window_bars: 20
  # So mau toi thieu moi lat cat (symbol / chien luoc / soft rule /
  # PTCB) moi duoc de xuat tinh chinh — it hon thi bao "chua du mau".
  min_sample_for_proposal: 20
# Mo hinh AI outcome offline (xem docs/ai-ta-model.md): hoc
# P(ket qua lenh | context thi truong, tham so TA) de chinh tham
# so TA tu log + lich su. Torch la phu thuoc TUY CHON (chay
# `ai-setup` 1 lan, khong nam trong requirements.txt, quickstart
# khong tu cai). Train offline theo lich (ai-train / ai-tune),
# KHONG BAO GIO trong vong live M15.
ai:
  # Thu muc weights + sidecar JSON + bao cao train (gitignore).
  models_dir: data/ai-models
  # Do dai chuoi feature mo hinh an (32 hang lien tiep).
  seq_len: 32
  # So bar gan nhat dung de xep hang ung vien tham so (ai-tune).
  rank_bars: 2000
# Multi-timeframe TA v1 (xem multitimeframe.py): trend H1 loc tin
# hieu entry M15 — tin hieu nguoc trend H1 manh bi chan thanh HOLD.
# Thieu muc nay thi loc TAT (M15-only, hanh vi cu). Timing M5 va
# H4 NGOAI v1 (timing_enabled mac dinh false, H4 khong hop le).
timeframes:
  entry: M15  # khung nen vao lenh (M1 | M5 | M15 | H1 | D1)
  trend: H1  # khung nen xac dinh xu huong (M1 | M5 | M15 | H1 | D1)
  timing: M5  # khung nen tinh thoi diem vao — NGOAI v1, chi de cho
  trend_enabled: true  # bat loc HTF (false = M15-only nhu cu)
  timing_enabled: false  # bat loc timing M5 — NGOAI v1, de false
  htf_adx_min: 20  # ADX(14) H1 toi thieu moi tin trend (thap hon thi khong loc)
  trend_bars: 60  # so bar H1 gan nhat dung de tinh trend
data:
  # provider: simulated | mt5
  #   simulated: du lieu mo phong (mac dinh, khong can MT5).
  #   mt5: du lieu thoi gian thuc tu MT5 terminal (Exness DEMO).
  #   Xem docs/mt5-demo.md truoc khi doi sang mt5.
  provider: simulated
  # api_key: "ĐIỀN VÀO config.yaml, KHÔNG commit"
  # api_key_env: DIAMONDX10_API_KEY
  symbols:
    forex: ["EURUSD"]
    us_securities: ["AMD", "CDNS", "SNPS", "INTC", "NVDA"]
    xauusd: ["XAUUSD"]
    crypto: ["BTCUSD", "BNBUSD", "ETHUSD"]
# Backtest Phase 3 (docs/backtest.md): phi + truot gia GIA DINH, bao thu.
# fee_pct: % tren notional (units x gia vao), tru 1 lan moi lenh tron.
# slippage_pct: % tren gia vao, ap dung bat loi ca 2 chan (vao + ra).
backtest:
  fee_pct: 0.02
  slippage_pct: 0.01
mt5:
  # CHI TAI KHOAN DEMO. Connector nay tu choi tai khoan that (xem execution.py).
  demo_only: true
  # Dien vao config.yaml LOCAL (khong commit): so tai khoan demo Exness.
  login: 0
  # Dien ten server demo that, vd "Exness-MT5Trial7" — xem trong MT5 terminal.
  server: ""
  # Mat khau demo: KHONG ghi vao file nay. Dat bien moi truong MT5_PASSWORD
  # (khuyen dung) hoac them dong password: ... vao config.yaml local.
  password_env: MT5_PASSWORD
  # Khung nen lay tu MT5: M1, M5, M15, H1, D1 (mac dinh M15).
  timeframe: M15
  # Duong dan file terminal64.exe cua MT5. De trong thi quickstart
  # tu tim (auto-scan moi lan chay); chi dien khi terminal cai o cho
  # khac vi tri mac dinh. Co the ghi de bang bien moi truong
  # MT5_TERMINAL_PATH. Duong dan Windows ghi bang dau / de YAML doc
  # duoc (vd C:/Program Files/MetaTrader 5 EXNESS/terminal64.exe).
  terminal_path: ""
  # Hau to symbol cua server Exness: server TRIAL them "m" vao moi
  # symbol (EURUSD -> EURUSDm), server REAL khong co hau to.
  # "auto" (mac dinh): tu nhan theo ten server (chua "Trial" -> "m",
  # "Real" -> ""); dat "m" hoac "" de ep buoc, khong theo server.
  # Ten symbol chuan trong data.symbols KHONG doi — hau to chi ap
  # dung khi noi voi MT5 (xem mt5_feed.build_symbol_map).
  symbol_suffix: "auto"
# Vong lap live (Phase D — xem docs/live-loop.md).
# `live --once` chay 1 chu ky roi thoat (dung cho Task Scheduler/cron);
# khong --once thi lap toi bien nen tiep theo toi khi Ctrl+C.
# timeframe: khung nen moi chu ky (mac dinh M15).
# interval_min: so phut giua 2 chu ky o che do lap (mac dinh 15).
live:
  timeframe: M15
  interval_min: 15
# Che do khuyen nghi (xem docs/live-loop.md §6).
# require_confirmation: true thi tool KHONG tu dat lenh khi co tin hieu:
#   chi gui khuyen nghi Telegram kem nut "Dat lenh", cho bam nut moi dat
#   (lenh telegram-listen nhan nut bam). Mac dinh false = tu dat lenh.
trading:
  require_confirmation: false
# Tong hop Yuling (PTKT + PTCB — xem docs/trading-principles.md, muc 37).
# verdict_max_age_hours: nhan dinh PTCB cu hon so gio nay thi coi nhu
#   chua co PTCB moi (size 0.5 theo PTKT; neu require_fa thi chan).
# require_fa: true thi bat buoc phai co PTCB moi moi cho vao lenh
#   (thieu/qua han -> KHONG MUA, size 0, blocked).
# fa_high_confidence: tin cay PTCB >= muc nay thi coi la cao
#   (dong thuan -> size 1.0; mau thuan -> chan).
synthesis:
  verdict_max_age_hours: 24
  require_fa: false
  fa_high_confidence: 0.6
# Canh bao Telegram (Phase D — xem docs/live-loop.md).
# Mac dinh TAT (enabled: false): chi gui khi user bat len + co token/chat_id.
# Token KHONG ghi vao file nay: dat bien moi truong ten trong
# bot_token_env (mac dinh DIAMONDX10_TELEGRAM_TOKEN). chat_id la ID chat
# nhan canh bao (chat rieng voi bot, hoac ID nhom).
telegram:
  enabled: false
  chat_id: ""
  bot_token_env: DIAMONDX10_TELEGRAM_TOKEN
  # Lenh cho xac nhan qua nut Telegram (xem docs/live-loop.md §6).
  # pending_order_ttl_min: lenh cho het han sau so phut nay (mac dinh 15).
  # max_entry_deviation_pct: gia thi truong lech khoi gia khuyen nghi qua
  #   so % nay thi listener tu choi dat lenh (mac dinh 1.0).
  pending_order_ttl_min: 15
  max_entry_deviation_pct: 1.0
# Trinh duyet Muse (xem docs/muse-browser.md).
# dx10 dieu khien cua so Chromium (Playwright) de gui file briefing
# cho Muse trong chat, tu dong hoa khau ban giao PTCB (muc 38).
# Playwright la phu thuoc TU CHON (opt-in): cai bang lenh `muse-setup`,
# KHONG nam trong luong mac dinh cua quickstart.py.
# KHONG co token/mat khau o day: dang nhap Muse lam thu cong 1 lan
# trong cua so trinh duyet, phien dang nhap luu local o profile_dir.
muse:
  # URL chat Muse mo trong trinh duyet (mac dinh https://muse.ai).
  chat_url: https://muse.ai
  # Thu muc profile trinh duyet giu phien dang nhap Muse cua user.
  # File RUNTIME, da gitignore — KHONG commit, KHONG copy di dau.
  profile_dir: data/muse-profile
  # headless: false = mo cua so trinh duyet that de user thay va dang
  #   nhap duoc; true = chay ngam (chi dung khi phien da luu san).
  headless: false
  # wait_min: so phut toi da doi Muse tra verdict JSON sau khi gui
  #   briefing (mac dinh 10). Het gio ma chua co verdict thi lenh
  #   thoat 1 — dung `verdict --file` nap tay sau.
  wait_min: 10
# Kho nen OHLC local (Phase A — xem docs/history-store.md).
# Backfill keo nen tu MT5 demo vao SQLite de backtest tren du lieu that.
# db_path tuong doi theo goc repo; file nay la file RUNTIME (da gitignore).
history:
  db_path: data/history.db
  default_timeframe: M15
  backfill_days: 90
# Tin tuc thi truong (Phase merge DiamondX10 + ThaoResearch — xem docs/market-news.md).
# Lay tin RSS cong khai, khong can credential. Tin chi la boi canh —
# khong tu dong doi tin hieu hay dat lenh. Chu ky chay: truoc phien
# giao dich + truoc gio tin lon (CPI/FOMC/Nonfarm).
news:
  max_age_days: 2
  # Che do TEST: bat len thi MOI tin co verdict tac dong buy/sell deu
  # duoc dang bai + gui khuyen nghi Telegram, bo qua nguong tin cay
  # 0.6 / dong thuan tong hop / loai tier (xem docs/analysis-workflow.md
  # muc 2d). Mac dinh TAT (false). Bat tam 1 lan ma khong doi config:
  # `synthesize --publish --test-mode`. Bai test luon danh dau [TEST]
  # (truong test_mode + tien to "[TEST] " trong tin Telegram) — khong
  # bao gio nham voi khuyen nghi that.
  test_mode: false
  # Tu dong lay tin dinh ky (web UI / vong nen): bat len thi tool tu
  # lay tin moi sau moi auto_fetch_interval_min phut. Mac dinh TAT.
  auto_fetch_enabled: false
  auto_fetch_interval_min: 5  # phut giua 2 lan tu lay tin (1–60)
  filters:
    # Tu khoa loai bo (quang cao, tai ban, tin cu).
    blacklist_keywords: ["sponsored", "advertisement", "advertorial",
                         "giveaway", "promo code"]
    # Tu khoa khan (danh dau [KHAN] trong bao cao tin).
    high_priority_keywords: ["Federal Reserve", "FOMC", "interest rate decision",
                             "CPI", "Nonfarm", "rate cut", "rate hike",
                             "earnings", "ECB rate decision"]
  desks:
    forex:
      keywords: ["EURUSD", "euro", "ECB", "Federal Reserve", "Fed",
                 "dollar index", "DXY", "CPI", "inflation", "interest rate"]
    xauusd:
      keywords: ["gold", "XAUUSD", "bullion", "COMEX", "central bank gold",
                 "troy ounce", "LBMA"]
    crypto:
      keywords: ["Bitcoin", "BTC", "Ethereum", "ETH", "BNB", "Binance",
                 "crypto", "cryptocurrency"]
    us_securities:
      keywords: ["NVDA", "Nvidia", "AMD", "Intel", "INTC", "Cadence",
                 "CDNS", "Synopsys", "SNPS", "semiconductor", "AI chip",
                 "earnings"]
  # Nguon tin: tier 2 (BAO CHI — feed RSS cong khai). Tier 1 CHINH THONG
  # (Fed/ECB/SEC...) doc thu cong, khong co feed; tier 3 RO RI (x.com)
  # Rich tim thu cong, khong co feed tu dong — xem docs/market-news.md.
  # URL lay tu catalog cua ThaoResearch (da kiem chung); cac truy van
  # Google News theo dung mau cua catalog do.
  sources:
    - {name: "Google News — Gold", tier: 2, desks: ["xauusd"],
       url: "https://news.google.com/rss/search?q=gold+price+OR+%22gold+futures%22+OR+bullion+OR+%22central+bank+gold%22+when%3A30d&hl=en-US&gl=US&ceid=US:en"}
    - {name: "Google News — Fed/ECB/CPI", tier: 2, desks: ["forex"],
       url: "https://news.google.com/rss/search?q=%22Federal+Reserve%22+OR+ECB+OR+%22interest+rate+decision%22+OR+CPI+when%3A7d&hl=en-US&gl=US&ceid=US:en"}
    - {name: "Google News — Bitcoin", tier: 2, desks: ["crypto"],
       url: "https://news.google.com/rss/search?q=Bitcoin+OR+Ethereum+OR+BNB+price+when%3A7d&hl=en-US&gl=US&ceid=US:en"}
    - {name: "Google News — AI chips/earnings", tier: 2, desks: ["us_securities"],
       url: "https://news.google.com/rss/search?q=NVDA+OR+Nvidia+OR+AMD+OR+semiconductor+earnings+when%3A7d&hl=en-US&gl=US&ceid=US:en"}
    - {name: "Bloomberg — Markets", tier: 2, desks: ["forex", "us_securities"],
       url: "https://feeds.bloomberg.com/markets/news.rss"}
    - {name: "WSJ — Markets", tier: 2, desks: ["forex", "us_securities"],
       url: "https://feeds.a.dj.com/rss/RSSMarketsMain.xml"}
    - {name: "FT — Commodities", tier: 2, desks: ["xauusd"],
       url: "https://www.ft.com/commodities?format=rss"}
    - {name: "Investing.com — Commodities", tier: 2, desks: ["xauusd"],
       url: "https://www.investing.com/rss/news_11.rss"}
    - {name: "Nasdaq — Commodities", tier: 2, desks: ["xauusd", "us_securities"],
       url: "https://www.nasdaq.com/feed/rssoutbound?category=Commodities"}
    - {name: "Mining.com", tier: 2, desks: ["xauusd"],
       url: "https://www.mining.com/feed/"}
